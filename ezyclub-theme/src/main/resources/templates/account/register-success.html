<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:ezy="http://www.ezyplatform.com/thymeleaf/layout"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{ezytheme}">
<head>
    <link th:if="${loggedIn == true}" rel="stylesheet" type="text/css" ezy:vhref="/ezylogin/css/style.css" />
</head>
<body>
<div layout:fragment="content">
    <div class="container account-page">
        <div class="card account-card">
            <th:block th:replace="~{ezylogin/register-success :: content}"/>
        </div>
    </div>
</div>
<th:block layout:fragment="post-scripts">
    <th:block th:replace="~{ezylogin/register-success :: scripts}"/>
</th:block>
</body>
</html>
