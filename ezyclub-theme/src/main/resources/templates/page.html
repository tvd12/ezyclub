<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:ezy="http://www.ezyplatform.com/thymeleaf/layout">

<head th:remove="tag">
    <link th:if="${siteIconUrl == null}" rel="icon" type="image/svg+xml" ezy:vhref="/images/ezyclub-logo.svg">
    <th:block th:if="${commonFragments == null || commonFragments.get('styles') == null || commonFragments.get('styles').content == 'styles'}">
        <th:block th:if="${themeStyles == null}">
            <link rel="stylesheet" type="text/css" ezy:vhref="/css/main.css" />
        </th:block>
        <th:block th:if="${themeStyles != null}" th:each="themeStyle : ${themeStyles}">
            <link rel="stylesheet" type="text/css" ezy:vhref="${themeStyle}" />
        </th:block>
    </th:block>
    <th:block th:if="${commonFragments != null && commonFragments.get('styles') != null && commonFragments.get('styles').content != 'styles'}">
        <ezy:block ezy:utext="${commonFragments.get('styles').content}" />
    </th:block>
    <th:block th:if="${commonFragments != null && commonFragments.get('header') != null && !#strings.isEmpty(commonFragments.get('header').additionalHead)}">
        <ezy:block ezy:utext="${commonFragments.get('header').additionalHead}" />
    </th:block>
    <th:block th:if="${pageFragments != null && pageFragments.get('container') != null && !#strings.isEmpty(pageFragments.get('container').additionalHead)}">
        <ezy:block ezy:utext="${pageFragments.get('container').additionalHead}" />
    </th:block>
    <th:block th:if="${commonFragments != null && commonFragments.get('footer') != null && !#strings.isEmpty(commonFragments.get('footer').additionalHead)}">
        <ezy:block ezy:utext="${commonFragments.get('footer').additionalHead}" />
    </th:block>
    <link th:if="${loggedIn != true}" rel="stylesheet" type="text/css" ezy:vhref="/ezylogin/css/style.css" />
    <style th:if="${themeSettings != null}" th:inline="css">
    :root {
        --sm-primary: [(${themeSettings.validPrimaryColor})];
        --sm-primary-dark: color-mix(in srgb, var(--sm-primary) 80%, #000000);
        --sm-primary-soft: color-mix(in srgb, var(--sm-primary) 12%, #ffffff);
    }
    </style>
</head>
<body th:remove="tag">
<script th:inline="javascript">
/*<![CDATA[*/
var SM = window.SM || {};
SM.settings = /*[[${themeSettings}]]*/ {};
SM.currentPage = /*[[${currentPage}]]*/ '';
SM.loggedIn = /*[[${loggedIn == true}]]*/ false;
var showLogin = /*[[${showLogin == true}]]*/ false;
var showRegister = /*[[${showRegister == true}]]*/ false;
document.body.dataset.page = SM.currentPage || '';
/*]]>*/
</script>
<th:block>
    <th:block th:replace="~{fragments/header :: announcement}" />
    <th:block th:if="${commonFragments != null && commonFragments.get('header') != null && commonFragments.get('header').content != 'header'}">
        <ezy:block ezy:utext="${commonFragments.get('header').content}" />
    </th:block>
    <th:block th:if="${commonFragments == null || commonFragments.get('header') == null || commonFragments.get('header').content == 'header'}">
        <th:block th:replace="~{fragments/header :: header}" />
    </th:block>
</th:block>
<th:block th:if="${pageFragments != null && pageFragments.get('container') != null && pageFragments.get('container').content != 'container'}">
    <ezy:block ezy:utext="${pageFragments.get('container').content}" />
</th:block>
<th:block th:if="${pageFragments == null || pageFragments.get('container') == null || pageFragments.get('container').content == 'container'}">
    <main class="main-content">
        <div layout:fragment="content"></div>
    </main>
</th:block>
<th:block>
    <th:block th:if="${commonFragments != null && commonFragments.get('footer') != null && commonFragments.get('footer').content != 'footer'}">
        <ezy:block ezy:utext="${commonFragments.get('footer').content}" />
    </th:block>
    <th:block th:if="${commonFragments == null || commonFragments.get('footer') == null || commonFragments.get('footer').content == 'footer'}">
        <th:block th:replace="~{fragments/footer :: footer}" />
    </th:block>
</th:block>

<th:block th:replace="~{ezycommon/loading :: content}" />

<th:block layout:fragment="modals" />
<th:block th:if="${loggedIn != true}">
    <th:block th:replace="~{ezylogin/login :: content}" />
    <th:block th:replace="~{ezylogin/register :: content}" />
    <th:block th:replace="~{ezylogin/forgot-password :: content}" />
</th:block>

<th:block th:if="${commonFragments == null || commonFragments.get('scripts') == null || commonFragments.get('scripts').content == 'scripts'}">
    <script ezy:vsrc="/js/jquery.min.js" type="text/javascript"></script>
    <script ezy:vsrc="/js/icons.js" type="text/javascript"></script>
    <script ezy:vsrc="/js/main.js" type="text/javascript"></script>
</th:block>

<th:block th:if="${commonFragments != null && commonFragments.get('scripts') != null && commonFragments.get('scripts').content != 'scripts'}">
    <ezy:block ezy:utext="${commonFragments.get('scripts').content}" />
</th:block>

<th:block layout:fragment="import-scripts" />
<th:block layout:fragment="pre-main-scripts" />
<th:block layout:fragment="scripts" />
<th:block th:if="${loggedIn != true}">
    <th:block th:replace="~{ezylogin/login :: scripts}" />
    <th:block th:replace="~{ezylogin/register :: scripts}" />
    <th:block th:replace="~{ezylogin/forgot-password :: scripts}" />
</th:block>
<th:block layout:fragment="post-scripts" />
<th:block layout:fragment="final-scripts" />
<script>
$(document).ready(function () {
    ezyweb.formatDateStringElements();
    ezyweb.formatDateTimeStringElements();
    ezyweb.formatDateTimeMinuteStringElements();
    ezyweb.formatStatusTextElements();
    ezyweb.formatNumberWithCommasElements();
    if (ezyweb.lang) {
        ezyweb.appendLangParameterToLinks(ezyweb.lang);
    }
});
</script>

<th:block th:if="${commonFragments != null && commonFragments.get('header') != null && !#strings.isEmpty(commonFragments.get('header').additionalFoot)}">
    <ezy:block ezy:utext="${commonFragments.get('header').additionalFoot}" />
</th:block>
<th:block th:if="${pageFragments != null && pageFragments.get('container') != null && !#strings.isEmpty(pageFragments.get('container').additionalFoot)}">
    <ezy:block ezy:utext="${pageFragments.get('container').additionalFoot}" />
</th:block>
<th:block th:if="${commonFragments != null && commonFragments.get('footer') != null && !#strings.isEmpty(commonFragments.get('footer').additionalFoot)}">
    <ezy:block ezy:utext="${commonFragments.get('footer').additionalFoot}" />
</th:block>
</body>
</html>
